# BANCO — Nginx config for Coolify / Hostinger VPS.
#
# Topology: landing(/) · market/dealer-os(/market/) · admin-os(/admin/)
#           All three SPAs served as static files.
#           /api/* proxied to the api service (banco_api upstream).
#
# The upstream name `api` matches the service name in docker-compose.coolify.yml.
# In Coolify all compose services share one Docker network automatically.

upstream banco_api {
    server api:8080;
    keepalive 32;
}

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Body limit for listing media uploads (video). Keep in sync with API guard.
    client_max_body_size 60m;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Nginx health — used by container HEALTHCHECK and Coolify probes.
    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # ---- API reverse proxy --------------------------------------------------
    location /api/ {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Short-link redirect handled by API.
    location /l/ {
        proxy_pass         http://banco_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ---- hashed static assets: cache hard -----------------------------------
    location /assets/        { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /admin/assets/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /market/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # ---- admin SPA ----------------------------------------------------------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- market (dealer-os) SPA --------------------------------------------
    location /market/ {
        try_files $uri $uri/ /market/index.html;
    }

    # ---- landing SPA (root) -------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
